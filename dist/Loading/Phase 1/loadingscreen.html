<style>
    /* ==========================================================
       CINEMATIC LOADING SCREEN
       Scoped to #zoundz-loader to prevent conflicts
       ========================================================== */

    #zoundz-loader.zl-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    #zoundz-loader.zl-overlay.zl-hidden {
        display: none !important;
    }

    /* Content Wrapper */
    #zoundz-loader .zl-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        position: relative;
        z-index: 2;
    }

    /* Logo and Title Styles Removed */

    /* ==========================================================
       OSCILLATOR / VISUALIZER (Optional placeholders)
       ========================================================== */

    /* ==========================================================
       LOADING SCREEN SOCIAL ICONS (Inlined for reliability)
       ========================================================== */

    /* --- Social Icons Container --- */
    #zoundz-loader .zl-socials {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 30px;
        perspective: 1000px;
        z-index: 100001;
        /* High z-index */
        position: relative;
        width: 100%;
    }

    /* --- Social Pill --- */
    #zoundz-loader .zl-social-pill {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        border: 1px solid rgba(255, 255, 255, 0.15);
        cursor: default;

        /* Initial: hidden, pushed down */
        opacity: 0;
        transform: translate3d(0, 20px, 0);
        transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        will-change: transform, opacity;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
    }

    #zoundz-loader .zl-social-pill svg {
        width: 18px;
        height: 18px;
        fill: currentColor !important;
        z-index: 2;
        position: relative;
        display: block;
    }

    #zoundz-loader .zl-social-pill .pill-text {
        color: #ffffff !important;
        z-index: 2;
        position: relative;
    }

    /* --- Pill Colors --- */
    #zoundz-loader .zl-social-pill.instagram {
        background: #E1306C;
        box-shadow: 0 0 15px rgba(225, 48, 108, 0.4);
        border-color: rgba(225, 48, 108, 0.3);
    }

    #zoundz-loader .zl-social-pill.spotify {
        background: #1DB954;
        box-shadow: 0 0 15px rgba(29, 185, 84, 0.4);
        border-color: rgba(29, 185, 84, 0.3);
    }

    #zoundz-loader .zl-social-pill.apple {
        background: #FA2D48;
        box-shadow: 0 0 15px rgba(250, 45, 72, 0.4);
        border-color: rgba(250, 45, 72, 0.3);
    }

    #zoundz-loader .zl-social-pill.bandlab {
        background: #40BAFF;
        box-shadow: 0 0 20px rgba(64, 186, 255, 0.6);
        border-color: rgba(64, 186, 255, 0.3);
    }

    #zoundz-loader .zl-social-pill.amazon {
        background: #00A8E1;
        box-shadow: 0 0 15px rgba(0, 168, 225, 0.4);
        border-color: rgba(0, 168, 225, 0.3);
    }

    #zoundz-loader .zl-social-pill.soundcloud {
        background: #FF5500;
        box-shadow: 0 0 15px rgba(255, 85, 0, 0.4);
        border-color: rgba(255, 85, 0, 0.3);
    }

    #zoundz-loader .zl-social-pill.youtube {
        background: #FF0000;
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        border-color: rgba(255, 0, 0, 0.3);
    }

    #zoundz-loader .zl-social-pill.featurefm {
        background: #00C2CB;
        box-shadow: 0 0 15px rgba(0, 194, 203, 0.4);
        border-color: rgba(0, 194, 203, 0.3);
    }

    /* Hover effects */
    #zoundz-loader .zl-social-pill:hover {
        transform: translate3d(0, -2px, 0) scale(1.05) !important;
        filter: brightness(1.2);
        z-index: 10;
    }

    /* --- Show Icons Phase --- */
    #zoundz-loader.zl-phase-socials .zl-social-pill {
        opacity: 1 !important;
        transform: translate3d(0, 0, 0) !important;
        pointer-events: auto;
    }

    /* Staggered Delay */
    #zoundz-loader.zl-phase-socials .zl-social-pill:nth-child(1) {
        transition-delay: 0.1s;
    }

    #zoundz-loader.zl-phase-socials .zl-social-pill:nth-child(2) {
        transition-delay: 0.2s;
    }

    #zoundz-loader.zl-phase-socials .zl-social-pill:nth-child(3) {
        transition-delay: 0.3s;
    }

    #zoundz-loader.zl-phase-socials .zl-social-pill:nth-child(4) {
        transition-delay: 0.4s;
    }

    #zoundz-loader.zl-phase-socials .zl-social-pill:nth-child(5) {
        transition-delay: 0.5s;
    }

    #zoundz-loader.zl-phase-socials .zl-social-pill:nth-child(6) {
        transition-delay: 0.6s;
    }

    #zoundz-loader.zl-phase-socials .zl-social-pill:nth-child(7) {
        transition-delay: 0.7s;
    }

    #zoundz-loader.zl-phase-socials .zl-social-pill:nth-child(8) {
        transition-delay: 0.8s;
    }

    /* --- Exit Animation --- */
    #zoundz-loader.zl-phase-icons-exit .zl-social-pill {
        opacity: 0 !important;
        transform: translate3d(-30px, 0, 0) !important;
        transition: opacity 0.5s ease, transform 0.5s ease;
        pointer-events: none;
    }

    #zoundz-loader.zl-phase-icons-exit .zl-social-pill:nth-child(8) {
        transition-delay: 0.0s;
    }

    #zoundz-loader.zl-phase-icons-exit .zl-social-pill:nth-child(7) {
        transition-delay: 0.1s;
    }

    #zoundz-loader.zl-phase-icons-exit .zl-social-pill:nth-child(6) {
        transition-delay: 0.2s;
    }

    #zoundz-loader.zl-phase-icons-exit .zl-social-pill:nth-child(5) {
        transition-delay: 0.3s;
    }

    #zoundz-loader.zl-phase-icons-exit .zl-social-pill:nth-child(4) {
        transition-delay: 0.4s;
    }

    #zoundz-loader.zl-phase-icons-exit .zl-social-pill:nth-child(3) {
        transition-delay: 0.5s;
    }

    #zoundz-loader.zl-phase-icons-exit .zl-social-pill:nth-child(2) {
        transition-delay: 0.6s;
    }

    #zoundz-loader.zl-phase-icons-exit .zl-social-pill:nth-child(1) {
        transition-delay: 0.7s;
    }


    /* Exit Phase: Fade out overlay to reveal homepage */
    #zoundz-loader.zl-phase-exit {
        transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        opacity: 0;
        pointer-events: none;
    }

    /* Ensure Logo and Title fade out specifically if needed, 
       but fading the whole overlay (.zl-phase-exit) handles it.
       User asked for "Icon Fadeout > Logo&Title Fadeout".
       We will fade icons first (via Loadingicons.css class), then the whole overlay.
    */

    /* Homepage Elements Initial State (Hidden) */
    body.zl-active #app,
    body.zl-active .navbar {
        opacity: 0;
        pointer-events: none;
    }

    /* Homepage Elements Reveal State */
    body.zl-done #app,
    body.zl-done .navbar {
        transition: opacity 1.5s ease;
        opacity: 1;
    }

    /* Mobile Performance Optimizations */
    @media (max-width: 768px) {
        #zoundz-loader .zl-social-pill {
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            background: rgba(40, 40, 40, 0.9);
            /* Solid fallback */
            box-shadow: none !important;
            /* Disable expensive shadow on mobile */
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    }
</style>

<script>
    (function () {
        // Configuration
        var PHASE1_DURATION = 3000; // Start exit sequence at 3.0s
        var startTime = Date.now();
        var loader = document.getElementById('zoundz-loader');

        // Ensure body has active class
        document.body.classList.add('zl-active');

        function startSequence() {
            if (!loader) return;

            // Phase 1: Social Icons Fade In (Immediate)
            setTimeout(function () {
                loader.classList.add('zl-phase-socials');
            }, 500);

            var checkInterval = setInterval(function () {
                var elapsed = Date.now() - startTime;

                if (document.readyState === 'complete' && elapsed >= PHASE1_DURATION) {
                    clearInterval(checkInterval);
                    finishSequence();
                }
            }, 100);
        }

        function finishSequence() {
            // Step 1: Icons Fade Out (Right to Left)
            loader.classList.add('zl-phase-icons-exit');

            // Step 2: Signal Phase 1 Completion (Transition to Phase 2)
            setTimeout(function () {
                // Dispatch event for index.html to handle
                window.dispatchEvent(new Event('phase1-done'));

                // Fade out Phase 1 container
                loader.classList.add('zl-phase-exit');

                // Cleanup Phase 1 DOM after transition
                setTimeout(function () {
                    loader.remove();
                }, 1500);

            }, 1500); // Wait 1.5s for icons to exit (Total 4.5s)
        }

        // Start the sequence
        requestAnimationFrame(startSequence);

    })();
</script>
