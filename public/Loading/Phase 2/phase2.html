<div id="phase2-overlay" class="p2-overlay p2-hidden">
    <div class="p2-content">
        <img src="/Assets/mv-monogram.svg" alt="Music Vibe monogram" class="p2-logo" id="p2-logo" />

        <!-- Title and Tagline (Merged from Phase 3) -->
        <div class="p2-text-container" id="p2-text">
            <h1 class="p2-title">Music <span>Vibe</span></h1>
            <p class="p2-tagline">Emotions in Motion</p>
        </div>
    </div>
</div>

<style>
    .p2-overlay {
        position: fixed;
        inset: 0;
        z-index: 99998;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        opacity: 0;
        pointer-events: none;
        padding-top: 150px;
    }

    .p2-overlay.p2-active {
        opacity: 1;
        pointer-events: auto;
    }

    .p2-logo {
        position: absolute;
        width: 220px;
        height: auto;
        border: 0;
        border-radius: 0;
        object-fit: contain;
        opacity: 0;
        transform: scale(0.8);
        filter: drop-shadow(0 0 0 rgba(255, 255, 255, 0));
        transition: opacity 0.8s ease,
            transform 1s cubic-bezier(0.23, 1, 0.32, 1),
            filter 1s ease;
        z-index: 2;
    }

    .p2-overlay.p2-show-logo .p2-logo {
        opacity: 1;
        transform: scale(1);
        filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.22));
        animation: logoPulse 2s infinite alternate;
    }

    @keyframes logoPulse {
        from { filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.16)); }
        to { filter: drop-shadow(0 0 24px rgba(255, 255, 255, 0.3)); }
    }

    .p2-text-container {
        position: absolute;
        left: 50%;
        top: 60%;
        text-align: center;
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
        transition: opacity 1s ease, transform 1s ease;
        z-index: 1;
        width: auto;
        white-space: nowrap;
        margin: 0;
    }

    .p2-overlay.p2-reveal-text .p2-text-container {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }

    .p2-title {
        font-size: 3.5rem;
        font-weight: 800;
        letter-spacing: 1px;
        color: #eaeaf0;
        margin: 0;
    }

    .p2-title span {
        color: var(--accent, #ffffff);
    }

    .p2-tagline {
        color: var(--muted, #9a9aa8);
        font-size: 1.1rem;
        margin-top: 10px;
    }
</style>

<script>
    (function () {
        window.startPhase2 = function () {
            var overlay = document.getElementById('phase2-overlay');
            var p2Logo = document.getElementById('p2-logo');
            var p2Text = document.getElementById('p2-text');
            var homeLogo = document.querySelector('header .logo');

            if (!overlay || !p2Logo) {
                console.error("Phase 2 elements not found");
                return;
            }

            overlay.classList.remove('p2-hidden');
            overlay.classList.add('p2-active');

            if (homeLogo) {
                var rect = homeLogo.getBoundingClientRect();
                p2Logo.style.left = rect.left + 'px';
                p2Logo.style.top = rect.top + 'px';
                p2Logo.style.width = rect.width + 'px';
                p2Logo.style.height = rect.height + 'px';

                if (p2Text) {
                    var logoCenterX = rect.left + (rect.width / 2);
                    var logoBottomY = rect.bottom;
                    p2Text.style.left = logoCenterX + 'px';
                    p2Text.style.top = (logoBottomY + 20) + 'px';
                }
            } else {
                p2Logo.style.position = 'relative';
            }

            setTimeout(function () {
                overlay.classList.add('p2-show-logo');
            }, 100);

            setTimeout(function () {
                overlay.classList.add('p2-reveal-text');
            }, 600);

            setTimeout(function () {
                var content = document.querySelector('.p2-content');
                if (content) {
                    content.style.transition = 'opacity 1.2s ease';
                    content.style.opacity = '0';
                }

                setTimeout(function () {
                    var wrapper = document.getElementById('loader-inject-p2');
                    var currentOverlay = document.getElementById('phase2-overlay');
                    if (wrapper) wrapper.remove();
                    else if (currentOverlay) currentOverlay.remove();

                    document.body.classList.remove('zl-active');
                    document.body.classList.add('zl-done');
                }, 1200);
            }, 2500);
        };
    })();
</script>
