name: Supabase Keep-Alive

# Runs daily at midnight UTC — keeps Supabase from pausing due to inactivity.
# Can also be triggered manually from GitHub Actions UI (Actions tab → Run workflow).

on:
  schedule:
    - cron: '0 0 * * *'   # Every day at 00:00 UTC
  workflow_dispatch:       # Manual trigger from GitHub UI

jobs:
  ping-supabase:
    name: Ping Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🔍 Pinging Supabase..."

          START=$(date +%s%3N)

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/")

          END=$(date +%s%3N)
          LATENCY=$((END - START))

          if [ "$HTTP_STATUS" = "200" ]; then
            ALIVE=true
            echo "✅ Supabase responded | status: $HTTP_STATUS | latency: ${LATENCY}ms"
          else
            ALIVE=false
            echo "❌ Supabase ping failed | status: $HTTP_STATUS | latency: ${LATENCY}ms"
          fi

          echo "📝 Logging result to ping_log..."

          LOG_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"status\": $HTTP_STATUS, \"alive\": $ALIVE, \"latency_ms\": $LATENCY, \"source\": \"auto\"}" \
            "$SUPABASE_URL/rest/v1/ping_log")

          if [ "$LOG_STATUS" = "201" ]; then
            echo "✅ Logged to ping_log successfully"
          else
            echo "⚠️ ping_log write returned status: $LOG_STATUS"
          fi

          # Fail the workflow if Supabase is down (so GitHub sends you an email alert)
          if [ "$ALIVE" = "false" ]; then
            echo "🚨 Supabase appears to be down!"
            exit 1
          fi
