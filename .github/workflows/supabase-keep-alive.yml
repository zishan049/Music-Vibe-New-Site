name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping and Log
        run: |
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

          # ── Step 1: Ping Supabase ──
          echo "🔍 Pinging Supabase..."
          START=$(date +%s%3N)

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/")

          END=$(date +%s%3N)
          LATENCY=$((END - START))

          if [ "$HTTP_STATUS" = "200" ]; then
            ALIVE=true
            echo "✅ Supabase responded | status: $HTTP_STATUS | latency: ${LATENCY}ms"
          else
            ALIVE=false
            echo "❌ Ping failed | status: $HTTP_STATUS | latency: ${LATENCY}ms"
          fi

          # ── Step 2: Write JSON body to a file (avoids escaping issues) ──
          cat > /tmp/ping_payload.json <<EOF
          {
            "status": ${HTTP_STATUS},
            "alive": ${ALIVE},
            "latency_ms": ${LATENCY},
            "source": "auto"
          }
          EOF

          echo "📦 Payload:"
          cat /tmp/ping_payload.json

          # ── Step 3: Log to ping_log ──
          echo "📝 Writing to ping_log..."

          LOG_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
            -X POST \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d @/tmp/ping_payload.json \
            "${SUPABASE_URL}/rest/v1/ping_log")

          echo "📬 Response:"
          echo "$LOG_RESPONSE"

          LOG_CODE=$(echo "$LOG_RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)

          if [ "$LOG_CODE" = "201" ]; then
            echo "✅ Logged successfully with source=auto"
          else
            echo "⚠️ Log write returned: $LOG_CODE"
          fi

          # Fail workflow if Supabase is down
          if [ "$ALIVE" = "false" ]; then
            exit 1
          fi
