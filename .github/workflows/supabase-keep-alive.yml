name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping and Log
        run: |
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

          echo "🔍 Pinging Supabase..."
          START=$(date +%s%N)

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/")

          END=$(date +%s%N)
          LATENCY=$(( (END - START) / 1000000 ))

          if [ "$HTTP_STATUS" = "200" ]; then
            ALIVE=true
            echo "✅ Supabase responded | status: $HTTP_STATUS | latency: ${LATENCY}ms"
          else
            ALIVE=false
            echo "❌ Ping failed | status: $HTTP_STATUS | latency: ${LATENCY}ms"
          fi

          # Build JSON with jq (guaranteed valid)
          PAYLOAD=$(jq -n \
            --argjson status "$HTTP_STATUS" \
            --argjson alive "$ALIVE" \
            --argjson latency "$LATENCY" \
            --arg source "auto" \
            '{status: $status, alive: $alive, latency_ms: $latency, source: $source}')

          echo "📦 Payload: $PAYLOAD"

          echo "📝 Writing to ping_log..."
          LOG_BODY=$(curl -s \
            -X POST \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "${PAYLOAD}" \
            -w "\n%{http_code}" \
            "${SUPABASE_URL}/rest/v1/ping_log")

          HTTP_LOG=$(echo "$LOG_BODY" | tail -1)
          RESPONSE=$(echo "$LOG_BODY" | head -n -1)

          echo "📬 HTTP: $HTTP_LOG"
          echo "📬 Body: $RESPONSE"

          if [ "$HTTP_LOG" = "201" ]; then
            echo "✅ Logged with source=auto"
          else
            echo "❌ Log failed with HTTP $HTTP_LOG"
          fi

          if [ "$ALIVE" = "false" ]; then
            exit 1
          fi
