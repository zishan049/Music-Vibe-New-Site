name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping and Log
        run: |
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

          echo "🔍 Pinging Supabase..."
          START=$(date +%s%3N)

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/")

          END=$(date +%s%3N)
          LATENCY=$((END - START))

          if [ "$HTTP_STATUS" = "200" ]; then
            ALIVE=true
            echo "✅ Supabase responded | status: $HTTP_STATUS | latency: ${LATENCY}ms"
          else
            ALIVE=false
            echo "❌ Ping failed | status: $HTTP_STATUS | latency: ${LATENCY}ms"
          fi

          PAYLOAD=$(printf '{"status":%s,"alive":%s,"latency_ms":%s,"source":"auto"}' "$HTTP_STATUS" "$ALIVE" "$LATENCY")
          echo "📦 Payload: $PAYLOAD"

          echo "📝 Writing to ping_log..."
          LOG_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
            -X POST \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "$PAYLOAD" \
            "${SUPABASE_URL}/rest/v1/ping_log")

          echo "📬 Response: $LOG_RESPONSE"

          if echo "$LOG_RESPONSE" | grep -q '"source":"auto"'; then
            echo "✅ Confirmed: source=auto in database"
          else
            echo "⚠️ Source may not be auto — check response above"
          fi

          if [ "$ALIVE" = "false" ]; then
            exit 1
          fi
