name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping and Log
        shell: python
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          import urllib.request
          import json
          import time
          import os

          url = os.environ["SUPABASE_URL"].strip()
          key = os.environ["SUPABASE_KEY"].strip()

          headers = {
              "apikey": key,
              "Authorization": f"Bearer {key}",
              "Content-Type": "application/json",
          }

          # ── Ping Supabase ──
          print("🔍 Pinging Supabase...")
          start = time.time()
          try:
              req = urllib.request.Request(f"{url}/rest/v1/", headers=headers)
              with urllib.request.urlopen(req, timeout=15) as resp:
                  status = resp.status
          except urllib.error.HTTPError as e:
              status = e.code
          except Exception as e:
              status = 0
              print(f"❌ Error: {e}")

          latency = int((time.time() - start) * 1000)
          alive = status == 200

          print(f"{'✅' if alive else '❌'} Status: {status} | Latency: {latency}ms")

          # ── Log to ping_log ──
          payload = json.dumps({
              "status": status,
              "alive": alive,
              "latency_ms": latency,
              "source": "auto"
          })

          print(f"📦 Payload: {payload}")
          print("📝 Writing to ping_log...")

          try:
              req = urllib.request.Request(
                  f"{url}/rest/v1/ping_log",
                  data=payload.encode("utf-8"),
                  headers={**headers, "Prefer": "return=representation"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  body = resp.read().decode("utf-8")
                  print(f"✅ Logged! Response: {body}")
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8")
              print(f"❌ Log failed: HTTP {e.code} — {body}")
          except Exception as e:
              print(f"❌ Log error: {e}")

          if not alive:
              raise SystemExit(1)
